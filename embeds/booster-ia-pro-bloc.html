<!--
  Booster IA Pro — bloc à coller dans un bloc HTML / code de votre site.

  • La landing complète, sans en-tête ni pied de page (votre site apporte les siens).
  • Isolée dans une iframe : aucun style ne passe dans un sens ni dans l'autre.
    Rien ne peut casser votre site, et votre feuille de style ne peut pas
    déformer la landing.
  • Sa hauteur s'ajuste automatiquement au contenu.
  • Aucun fichier à héberger : tout est dans ce bloc.

  Pour changer l'adresse du bouton « Parlons-en » : cherchez
  https://www.shakeagency.io/contact ci-dessous et remplacez-la.
-->
<div id="shk-ia-bloc" style="width:100%">
  <iframe
    id="shk-ia-iframe"
    title="Booster IA Pro"
    loading="lazy"
    style="width:100%;height:600px;border:0;display:block;color-scheme:light"
  ></iframe>
</div>

ya! First facials are honestly the best — instant glow\"},{type:\"msg\",direction:\"out\",grouped:!0,text:\"Quick check: any active breakouts or sensitive skin we should know about? Just so we tailor it for you\"},{type:\"msg\",direction:\"in\",text:\"a bit of redness around the nose sometimes, nothing major\"},{type:\"msg\",direction:\"out\",text:\"Got it — that's very manageable, our therapist will adjust the serums for that\"},{type:\"msg\",direction:\"in\",text:\"how much is it? and how long does it take\"},{type:\"msg\",direction:\"out\",text:\"The Hydrafacial is $120 and runs about 60 minutes\"},{type:\"msg\",direction:\"out\",grouped:!0,text:\"You can go straight back to your day after — a little glow, no peeling or redness\"},{type:\"system\",tone:\"lead\",label:\"Lead asked pricing · buying signal\"},{type:\"msg\",direction:\"in\",text:\"ok love that. can I come in this week?\"},{type:\"system\",tone:\"ai\",label:\"Retrieved available slots from calendar\"},{type:\"msg\",direction:\"out\",text:\"Yes! This week I have Wednesday 11:00, Thursday 14:30, or Friday 16:00\"},{type:\"msg\",direction:\"out\",grouped:!0,text:\"Which works best for you?\"},{type:\"msg\",direction:\"in\",text:\"thursday afternoon is perfect\"},{type:\"msg\",direction:\"out\",text:\"Thursday 14:30 it is 🎉 To lock it in we take a small $25 deposit, which comes straight off your treatment on the day\"},{type:\"msg\",direction:\"out\",grouped:!0,text:\"Here's the secure link: lumiereskin.example/book\"},{type:\"msg\",direction:\"in\",text:\"done!\",leading:d.jsx(Xo,{})},{type:\"system\",tone:\"ai\",label:\"Deposit confirmed · $25\"},{type:\"msg\",direction:\"out\",text:\"Perfect, deposit received and your spot is confirmed 💖\"},{type:\"msg\",direction:\"out\",grouped:!0,text:\"You're booked for the Hydrafacial, Thursday at 14:30. I'll send a reminder the day before. Come with a clean face if you can — see you then, Maya!\"},{type:\"system\",tone:\"win\",label:\"Appointment booked · Thu 14:
